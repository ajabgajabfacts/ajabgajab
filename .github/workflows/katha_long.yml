name: "Ajab Gajab — Long-form Stories"

# Two long videos a week (~8-10 min, 7 fact-checked chapters, landscape):
#   Sunday    05:35 UTC = 11:05 IST  Hindi
#   Wednesday 05:35 UTC = 11:05 IST  Telugu (owner best bet 2026-10-21; was a weekly regional rotation)
# Collections rotate per language (katha/longform.py ORDER), so no theme repeats back to back.
on:
  schedule:
    - cron: "35 5 * * 0"
    - cron: "35 5 * * 3"
  workflow_dispatch:
    inputs:
      lang:
        description: "Language (hi, mr, bn, ta, te, kn, ml, gu, or, pa); blank = today's rotation"
        type: string
        default: ""
      collection:
        description: "Collection (mysteries, gods, marvels, mahabharata, wild, devotion, legends, food); blank = next"
        type: string
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: ajabgajab-katha-long
  cancel-in-progress: false

jobs:
  long:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}   # branch HEAD, not the triggering sha (see katha.yml)
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: katha/requirements.txt
      - name: ffmpeg
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq ffmpeg
      - name: Python dependencies
        run: pip install --quiet -r katha/requirements.txt
      - name: Pick language
        id: lang
        run: |
          # Owner 2026-10-21 "best bets": until the long-form has data, each slot goes to what the Shorts proved.
          # Sunday = Hindi mysteries (Karni Mata 1,296 views); Wednesday = Telugu devotion (Kannappa's eyes 1,372,
          # Telugu the strongest language) instead of the weekly regional rotation. Review after 2026-11-02.
          C="${{ inputs.collection }}"
          if [ -n "${{ inputs.lang }}" ]; then L="${{ inputs.lang }}"
          elif [ "$(date -u +%u)" = "7" ]; then L=hi; C="${C:-mysteries}"
          else L=te; C="${C:-devotion}"
          fi
          echo "l=$L" >> "$GITHUB_OUTPUT"; echo "c=$C" >> "$GITHUB_OUTPUT"; echo "language: $L  collection: ${C:-rotation}"
      - name: Write, check, render and upload
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CHANNEL_CONFIG: ${{ secrets.CHANNEL_CONFIG }}
        run: |
          ARGS="--lang ${{ steps.lang.outputs.l }}"
          [ -n "${{ steps.lang.outputs.c }}" ] && ARGS="$ARGS --collection ${{ steps.lang.outputs.c }}"
          python katha/longform.py $ARGS
      - name: Commit ledger
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f katha/longform_ledger.json ] && git add katha/longform_ledger.json
          [ -f katha/playlists.json ] && git add katha/playlists.json
          git diff --staged --quiet && exit 0
          git commit -m "katha: update long-form ledger [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${{ github.ref_name }}" && git push origin "${{ github.ref_name }}" && exit 0
            sleep 5
          done
          exit 1
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "Long-form story failed: $(date -u '+%F %H:%M') ${{ steps.lang.outputs.l }}" \
            --body "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
