name: "Ajab Gajab Facts — 4 Hinglish Reels Daily"

# Primary trigger: cron-job.org → workflow_dispatch API at 02:00, 07:30, 13:00,
# 16:00 UTC (India morning / lunch / evening / night — IST +5:30). Backup trigger:
# GitHub schedule ~90 min after each slot; the SKIP_IF_POSTED_TODAY guard in
# pipeline_animated.py exits cleanly when the slot already posted, and judges the
# slot by TRIGGER_CRON (scheduled time), dropping runs delivered past UTC midnight.
on:
  workflow_dispatch:
    inputs:
      force_post:
        description: "Post even if today's 4-video cap is already used (test posts)"
        type: boolean
        default: false
      topic:
        description: "Force a specific reel key (blank = normal rotation)"
        type: string
        default: ""
  schedule:
    - cron: "30 3 * * *"
    - cron: "0 9 * * *"
    - cron: "30 14 * * *"
    - cron: "30 17 * * *"

permissions:
  contents: write
  issues: write

# Runs must not overlap. The ledger is only committed at the END of a job, so a
# second run that starts while the first is still uploading checks out a ledger
# that does not yet list the video just posted — it then picks the SAME reel and
# posts a duplicate. Queue instead of racing.
concurrency:
  group: ajabgajab-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: System dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-liberation fonts-dejavu-core ffmpeg

      - name: Python dependencies
        run: pip install --quiet -r requirements.txt

      - name: Render and upload Hinglish reel
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CHANNEL_CONFIG: ${{ secrets.CHANNEL_CONFIG }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          SKIP_IF_POSTED_TODAY: ${{ github.event_name == 'schedule' && '1' || '' }}
          TRIGGER_CRON: ${{ github.event.schedule }}
          # Only a hand-run dispatch can override the daily cap — a schedule or a
          # cron-job.org trigger must never be able to set these.
          FORCE_POST: ${{ github.event_name == 'workflow_dispatch' && inputs.force_post && '1' || '' }}
          TOPIC_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && inputs.topic || '' }}
        run: python pipeline_animated.py

      - name: Commit ledgers
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin "${{ github.ref_name }}" || true
          for f in topic_ledger.json anim_ledger.json playlist_map.json performance.json bg_used.json question_bank.json; do
            [ -f "$f" ] && git add "$f" || true
          done
          git diff --staged --quiet || git commit -m "Update ledgers [skip ci]"
          git push origin "${{ github.ref_name }}" && exit 0
          echo "[Ledger] push rejected — rebasing on the moved remote and retrying"
          git pull --rebase --autostash origin "${{ github.ref_name }}"
          git push origin "${{ github.ref_name }}"

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::error::Ajab Gajab Facts pipeline failed."
          TITLE="Posting failed: $(date -u '+%F %H:%M') — Ajab Gajab Facts"
          BODY="Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh issue create --title "$TITLE" --body "$BODY" --repo "${{ github.repository }}" || true
