name: "Wait, That's Real? — English story Shorts"

# English Shorts on Wait, That's Real? (the renamed Money Sorted), built by the same katha pipeline
# as Ajab Gajab. Ledger slots 4 and 5 mark them, so make.py's once-a-day guard keeps them apart from
# Ajab Gajab's slots 0-3.
#   slot 4: 22:05 UTC = 6:05 pm US Eastern (US evening peak); 23:35 UTC is the backup for a dropped run.
#   slot 5 (from 2026-10-31, owner: WTR holds ~1k views a Short, so 2 a day): 15:05 UTC = 11 am ET /
#           3 pm UK, backup 16:35. Not on Sunday or Wednesday: the Ajab long-form runs at 15:35 on those
#           days and needs the Gemini free quota (~50 calls).
# Each slot's crons are on the same UTC date, so the ledger guard turns a backup into a no-op.
on:
  schedule:
    - cron: "5 22 * * *"
    - cron: "35 23 * * *"
    - cron: "5 15 * * 1,2,4,5,6"
    - cron: "35 16 * * 1,2,4,5,6"
  workflow_dispatch:
    inputs:
      slot:
        description: "Ledger slot: 4 (evening) or 5 (midday)"
        type: choice
        options: ["4", "5"]
        default: "4"
      key:
        description: "Force a story key from katha/bank.py (blank = next in rotation)"
        type: string
        default: ""
      force_post:
        description: "Post even if today's English Short is already up"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

# Shared with katha.yml: both commit katha/ledger.json.
concurrency:
  group: ajabgajab-katha
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - name: Already posted today?
        id: due
        env:
          SCHED: ${{ github.event.schedule }}
          SLOT_IN: ${{ inputs.slot }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import datetime, json, os
          today = str(datetime.datetime.now(datetime.timezone.utc).date())
          sched = os.environ.get("SCHED", "")
          slot = int(os.environ.get("SLOT_IN") or (5 if sched.startswith(("5 15", "35 16")) else 4))
          led = json.load(open("katha/ledger.json"))
          done = any(r.get("date") == today and r.get("slot") == slot and r.get("status") == "posted" for r in led)
          print(f"slot={slot}")
          print("skip=" + ("true" if done else "false"))
          EOF
      - uses: actions/setup-python@v7
        if: steps.due.outputs.skip != 'true' || inputs.force_post
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: katha/requirements.txt
      - name: ffmpeg
        if: steps.due.outputs.skip != 'true' || inputs.force_post
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq ffmpeg
      - name: PhotoCraft CLI (image clean-up; optional, katha/media.py enhance)
        if: steps.due.outputs.skip != 'true' || inputs.force_post
        continue-on-error: true
        run: |
          curl -fsSL -o /tmp/pc.tgz https://github.com/storytold/photocraft/releases/download/v0.14.0/photocraft-0.14.0-linux-x86_64.tar.gz
          echo "3d1f60a76c25aafbf53f23cfedd3687bd99eb6f5309920e140d588bd3212c936  /tmp/pc.tgz" | sha256sum -c -
          tar xzf /tmp/pc.tgz -C /tmp photocraft-0.14.0-linux-x86_64/bin/photocraft-cli
          sudo install /tmp/photocraft-0.14.0-linux-x86_64/bin/photocraft-cli /usr/local/bin/
          photocraft-cli commands --filter autoTone
      - name: Python dependencies
        if: steps.due.outputs.skip != 'true' || inputs.force_post
        run: pip install --quiet -r katha/requirements.txt
      - name: Write, check, render and upload
        if: steps.due.outputs.skip != 'true' || inputs.force_post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CHANNEL_CONFIG: ${{ secrets.CHANNEL_CONFIG_EN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}     # katha/aiart.py: illustrated scenes (off while unset)
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          AI_ART: ${{ vars.AI_ART }}     # repo variable AI_ART=0 turns the AI pictures off
          KATHA_SLOT: ${{ steps.due.outputs.slot }}
          FORCE_POST: ${{ github.event_name == 'workflow_dispatch' && inputs.force_post && '1' || '' }}
        run: |
          ARGS="--lang en"
          [ -n "${{ inputs.key }}" ] && ARGS="$ARGS --key ${{ inputs.key }}"
          python katha/make.py $ARGS
      - name: Commit ledger
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f katha/ledger.json ] && git add katha/ledger.json
          [ -f katha/playlists.json ] && git add katha/playlists.json
          [ -d katha/prewritten ] && git add -A -f katha/prewritten   # a used prewritten script is deleted
          [ -d katha/backup ] && git add -A -f katha/backup   # make.py moves a backup into prewritten on a Gemini-down day
          git diff --staged --quiet && exit 0
          git commit -m "katha: update ledger [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${{ github.ref_name }}" && git push origin "${{ github.ref_name }}" && exit 0
            sleep 5
          done
          exit 1
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "English Short failed: $(date -u '+%F %H:%M')" \
            --body "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
