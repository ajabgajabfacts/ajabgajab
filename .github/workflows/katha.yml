name: "Ajab Gajab — Story Shorts (all Indian languages)"

# 4 slots a day, one channel. Slot 3 is Telugu, slot 2 Hindi; 0 and 1 rotate through the
# other regional languages, weighted by our own numbers (katha/make.py slot_lang + insights.py, 2026-10-23). Times are IST peaks:
#   slot 0  02:35 UTC = 08:05 IST    slot 1  06:35 UTC = 12:05 IST
#   slot 2  12:35 UTC = 18:05 IST    slot 3  15:05 UTC = 20:35 IST
# A slot posts at most once a day (ledger guard), so a late or repeated trigger is harmless.
# GitHub delays and DROPS scheduled runs (the 06:35 slot never fired on day one), so every
# scheduled trigger posts the earliest DUE slot (katha/due.py), and a 2-hourly backup cron
# makes up anything dropped. due.py runs before setup, so an idle check costs seconds.
on:
  schedule:
    - cron: "35 2 * * *"
    - cron: "35 6 * * *"
    - cron: "35 12 * * *"
    - cron: "5 15 * * *"
    - cron: "50 */2 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "Slot 0-3 (3 = Telugu, 2 = Hindi, 0/1 = rotating regional)"
        type: string
        default: "0"
      lang:
        description: "Force a language (hi, mr, bn, ta, te, kn, ml, gu, or, pa); blank = slot rotation"
        type: string
        default: ""
      key:
        description: "Force a story key from katha/bank.py (blank = next in rotation)"
        type: string
        default: ""
      force_post:
        description: "Post even if this slot already posted today"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: ajabgajab-katha
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Check out the branch HEAD, not the triggering sha: a run queued behind another one in this
      # concurrency group otherwise reads the ledger from before that run's push and posts the same
      # slot again (2026-10-19 slot 3: Kannappa went up twice, issue #3).
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - name: Pick slot
        id: slot
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "n=${{ inputs.slot || '0' }}" >> "$GITHUB_OUTPUT"
          else
            N=$(python3 katha/due.py); echo "n=$N" >> "$GITHUB_OUTPUT"; echo "due slot: $N"
          fi
      - uses: actions/setup-python@v7
        if: steps.slot.outputs.n != 'none'
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: katha/requirements.txt
      - name: ffmpeg
        if: steps.slot.outputs.n != 'none'
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq ffmpeg
      - name: PhotoCraft CLI (image clean-up; optional, katha/media.py enhance)
        if: steps.slot.outputs.n != 'none'
        continue-on-error: true
        run: |
          curl -fsSL -o /tmp/pc.tgz https://github.com/storytold/photocraft/releases/download/v0.14.0/photocraft-0.14.0-linux-x86_64.tar.gz
          echo "3d1f60a76c25aafbf53f23cfedd3687bd99eb6f5309920e140d588bd3212c936  /tmp/pc.tgz" | sha256sum -c -
          tar xzf /tmp/pc.tgz -C /tmp photocraft-0.14.0-linux-x86_64/bin/photocraft-cli
          sudo install /tmp/photocraft-0.14.0-linux-x86_64/bin/photocraft-cli /usr/local/bin/
          photocraft-cli commands --filter autoTone
      - name: Python dependencies
        if: steps.slot.outputs.n != 'none'
        run: pip install --quiet -r katha/requirements.txt
      - name: Write, check, render and upload
        if: steps.slot.outputs.n != 'none'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CHANNEL_CONFIG: ${{ secrets.CHANNEL_CONFIG }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN_AJAB }}   # katha/fb.py: slots 1 and 3 also go to Facebook
          KATHA_SLOT: ${{ steps.slot.outputs.n }}
          FORCE_POST: ${{ github.event_name == 'workflow_dispatch' && inputs.force_post && '1' || '' }}
        run: |
          ARGS="--lang ${{ inputs.lang || 'auto' }}"
          [ -n "${{ inputs.key }}" ] && ARGS="$ARGS --key ${{ inputs.key }}"
          python katha/make.py $ARGS
      - name: Commit ledger
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f katha/ledger.json ] && git add katha/ledger.json
          [ -f katha/playlists.json ] && git add katha/playlists.json
          [ -d katha/prewritten ] && git add -A -f katha/prewritten   # a used prewritten script is deleted
          [ -d katha/backup ] && git add -A -f katha/backup   # make.py moves a backup into prewritten on a Gemini-down day
          git diff --staged --quiet && exit 0
          git commit -m "katha: update ledger [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${{ github.ref_name }}" && git push origin "${{ github.ref_name }}" && exit 0
            sleep 5
          done
          exit 1
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "Story Short failed: $(date -u '+%F %H:%M') slot ${{ steps.slot.outputs.n }}" \
            --body "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
