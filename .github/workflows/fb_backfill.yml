name: "Ajab Gajab — Facebook backfill (top Shorts first)"

# Re-renders the most-viewed katha Shorts (Mysore Palace kn first) and posts them to the
# Ajab Gajab Stories Facebook Page as Reels (katha/fb_backfill.py). Nothing goes to YouTube.
# While the queue has items, the slot 1/3 cross-post stands down, so fb.py's 3-a-day cap
# goes here first.
#   03:15 UTC = 8:45 am IST   09:15 UTC = 2:45 pm IST   14:15 UTC = 7:45 pm IST
on:
  # PAUSED 2026-11-14 (owner): Facebook gets nothing; see PAUSED in fb.py.
  # schedule:
  #   - cron: "15 3 * * *"
  #   - cron: "15 9 * * *"
  #   - cron: "15 14 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: ajabgajab-katha
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - name: Anything queued?
        id: q
        run: |
          python3 -c "import json;q=json.load(open('katha/fb_backfill.json'));print('left='+str(sum(x['status']=='queued' for x in q)))" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v7
        if: steps.q.outputs.left != '0'
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: katha/requirements.txt
      - name: ffmpeg
        if: steps.q.outputs.left != '0'
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq ffmpeg
      - name: PhotoCraft CLI (image clean-up; optional, katha/media.py enhance)
        if: steps.q.outputs.left != '0'
        continue-on-error: true
        run: |
          curl -fsSL -o /tmp/pc.tgz https://github.com/storytold/photocraft/releases/download/v0.14.0/photocraft-0.14.0-linux-x86_64.tar.gz
          echo "3d1f60a76c25aafbf53f23cfedd3687bd99eb6f5309920e140d588bd3212c936  /tmp/pc.tgz" | sha256sum -c -
          tar xzf /tmp/pc.tgz -C /tmp photocraft-0.14.0-linux-x86_64/bin/photocraft-cli
          sudo install /tmp/photocraft-0.14.0-linux-x86_64/bin/photocraft-cli /usr/local/bin/
      - name: Python dependencies
        if: steps.q.outputs.left != '0'
        run: pip install --quiet -r katha/requirements.txt
      - name: Render and post the next top Short
        if: steps.q.outputs.left != '0'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CHANNEL_CONFIG: ${{ secrets.CHANNEL_CONFIG }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN_AJAB }}
        run: python katha/fb_backfill.py next
      - name: Commit the queue
        if: always() && steps.q.outputs.left != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Only the queue: these stories already shipped on YouTube, the ledger must not change.
          git add katha/fb_backfill.json
          git diff --staged --quiet && exit 0
          git commit -m "fb backfill: update queue [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${{ github.ref_name }}" && git push origin "${{ github.ref_name }}" && exit 0
            sleep 5
          done
          exit 1
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "FB backfill failed: $(date -u '+%F %H:%M')" \
            --body "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
