name: "Trend radar — what each audience is looking up"

# katha/radar.py (2026-11-14, owner: "build the trend version for each channel"): Google Trends per Indian
# state + US/UK, each language's Wikipedia most-read list and YouTube's most popular in India/US, written to
# katha/trend_radar.json. The Claude trend scout routine reads it at ~00:20 UTC (trends.py). 23:40 UTC so the
# Wikipedia lists for the day just ended are out; GitHub may run it late, which still lands before the scout
# most nights (the scout researches on the web either way).
on:
  schedule:
    - cron: "40 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: katha/requirements.txt
      - name: Python dependencies
        run: pip install --quiet -r katha/requirements.txt
      - name: Collect signals
        env:
          CHANNEL_CONFIG: ${{ secrets.CHANNEL_CONFIG }}
        run: python katha/radar.py --print
      - name: Commit radar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f katha/trend_radar.json
          git diff --staged --quiet && exit 0
          git commit -m "katha: trend radar [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${{ github.ref_name }}" && git push origin "${{ github.ref_name }}" && exit 0
            sleep 5
          done
          exit 1
